<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Retro Games Hub</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #ecf0f1; }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #34495e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        /* Menu Buttons */
        .menu-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 15px 30px;
            margin: 10px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        .menu-btn:hover { background-color: #2980b9; }
        .back-btn {
            background-color: #e74c3c;
            padding: 10px 20px;
            margin-bottom: 20px;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
        
        /* Game Screens */
        .game-screen { display: none; }
        .active { display: block; }

        /* Snake Game CSS */
        canvas {
            background: #000;
            border: 2px solid #ecf0f1;
            margin-top: 10px;
        }

        /* Dino Game CSS */
        #dino-game {
            width: 400px;
            height: 200px;
            border: 2px solid white;
            background-color: #87CEEB;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
        }
        #dino {
            width: 40px;
            height: 40px;
            background-color: #2c3e50;
            position: absolute;
            top: 160px;
            left: 20px;
        }
        #obstacle {
            width: 20px;
            height: 40px;
            background-color: #e74c3c;
            position: absolute;
            top: 160px;
            left: 400px;
        }
        .jump { animation: jumpAnim 0.5s linear; }
        @keyframes jumpAnim {
            0% { top: 160px; }
            40% { top: 70px; }
            50% { top: 70px; }
            60% { top: 70px; }
            100% { top: 160px; }
        }
        .obstacle-move { animation: moveAnim 1.5s infinite linear; }
        @keyframes moveAnim {
            0% { left: 400px; }
            100% { left: -20px; }
        }

        /* Puzzle Game CSS */
        .puzzle-input {
            padding: 10px;
            font-size: 18px;
            border-radius: 5px;
            border: none;
        }
        .puzzle-btn {
            padding: 10px 20px;
            font-size: 18px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- MAIN MENU -->
    <div id="main-menu" class="game-screen active">
        <h1>🎮 My Mini Games Hub</h1>
        <p>Pumili ng laro na gusto mong subukan:</p>
        <button class="menu-btn" onclick="showGame('snake')">🐍 Snake Game</button>
        <button class="menu-btn" onclick="showGame('dino')">🦖 Jumping Dino</button>
        <button class="menu-btn" onclick="showGame('puzzle')">🧩 Number Puzzle</button>
    </div>

    <!-- SNAKE GAME -->
    <div id="snake-screen" class="game-screen">
        <button class="back-btn" onclick="showMainMenu()">⬅ Back to Menu</button>
        <h2>Snake Game</h2>
        <p>Gamitin ang Arrow Keys para gumalaw.</p>
        <canvas id="snakeCanvas" width="400" height="400"></canvas>
    </div>

    <!-- DINO JUMP GAME -->
    <div id="dino-screen" class="game-screen">
        <button class="back-btn" onclick="showMainMenu()">⬅ Back to Menu</button>
        <h2>Jumping Dino</h2>
        <p>Pindutin ang SPACEBAR o i-click ang screen para tumalon.</p>
        <div id="dino-game" onclick="jump()">
            <div id="dino"></div>
            <div id="obstacle"></div>
        </div>
        <p id="dino-score">Score: 0</p>
    </div>

    <!-- PUZZLE GAME -->
    <div id="puzzle-screen" class="game-screen">
        <button class="back-btn" onclick="showMainMenu()">⬅ Back to Menu</button>
        <h2>Number Puzzle</h2>
        <p>May naisip akong numero mula 1 hanggang 10. Mahuhulaan mo ba?</p>
        <input type="number" id="guessInput" class="puzzle-input" placeholder="Enter number...">
        <button class="puzzle-btn" onclick="checkGuess()">Guess</button>
        <p id="puzzle-message"></p>
    </div>
</div>

<script>
    // --- NAVIGATION LOGIC ---
    function showGame(gameId) {
        document.getElementById('main-menu').classList.remove('active');
        document.getElementById(gameId + '-screen').classList.add('active');
        
        if(gameId === 'snake') startSnake();
        if(gameId === 'dino') startDino();
    }

    function showMainMenu() {
        document.querySelectorAll('.game-screen').forEach(screen => {
            screen.classList.remove('active');
        });
        document.getElementById('main-menu').classList.add('active');
        
        // Stop games when returning to menu
        clearInterval(snakeInterval);
        clearInterval(dinoCheck);
    }

    // --- SNAKE GAME LOGIC ---
    let snakeCanvas, snakeCtx, snakeInterval;
    let snake = [{x: 200, y: 200}];
    let dx = 20, dy = 0;
    let foodX, foodY;

    function startSnake() {
        snakeCanvas = document.getElementById("snakeCanvas");
        snakeCtx = snakeCanvas.getContext("2d");
        snake = [{x: 200, y: 200}];
        dx = 20; dy = 0;
        spawnFood();
        if(snakeInterval) clearInterval(snakeInterval);
        snakeInterval = setInterval(updateSnake, 100);
    }

    function spawnFood() {
        foodX = Math.floor(Math.random() * 20) * 20;
        foodY = Math.floor(Math.random() * 20) * 20;
    }

    function updateSnake() {
        let head = {x: snake[0].x + dx, y: snake[0].y + dy};
        snake.unshift(head);

        if (head.x === foodX && head.y === foodY) {
            spawnFood();
        } else {
            snake.pop();
        }

        // Game Over logic (hit wall)
        if (head.x < 0 || head.x >= 400 || head.y < 0 || head.y >= 400) {
            alert("Game Over! Back to start.");
            startSnake();
            return;
        }

        drawSnake();
    }

    function drawSnake() {
        snakeCtx.fillStyle = "black";
        snakeCtx.fillRect(0, 0, 400, 400);

        snakeCtx.fillStyle = "red";
        snakeCtx.fillRect(foodX, foodY, 20, 20);

        snakeCtx.fillStyle = "lime";
        snake.forEach(part => snakeCtx.fillRect(part.x, part.y, 20, 20));
    }

    document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowUp" && dy === 0) { dx = 0; dy = -20; }
        if (e.key === "ArrowDown" && dy === 0) { dx = 0; dy = 20; }
        if (e.key === "ArrowLeft" && dx === 0) { dx = -20; dy = 0; }
        if (e.key === "ArrowRight" && dx === 0) { dx = 20; dy = 0; }
        
        // Dino Jump
        if (e.key === " " && document.getElementById('dino-screen').classList.contains('active')) {
            jump();
        }
    });

    // --- DINO JUMP GAME LOGIC ---
    let dinoCheck;
    let dinoScore = 0;

    function startDino() {
        let obstacle = document.getElementById("obstacle");
        obstacle.classList.add("obstacle-move");
        dinoScore = 0;
        
        if(dinoCheck) clearInterval(dinoCheck);
        dinoCheck = setInterval(checkDinoHit, 10);
    }

    function jump() {
        let dino = document.getElementById("dino");
        if (!dino.classList.contains("jump")) {
            dino.classList.add("jump");
            setTimeout(() => {
                dino.classList.remove("jump");
                dinoScore++;
                document.getElementById("dino-score").innerText = "Score: " + dinoScore;
            }, 500);
        }
    }

    function checkDinoHit() {
        let dino = document.getElementById("dino");
        let obstacle = document.getElementById("obstacle");

        let dinoTop = parseInt(window.getComputedStyle(dino).getPropertyValue("top"));
        let obstacleLeft = parseInt(window.getComputedStyle(obstacle).getPropertyValue("left"));

        // Collision logic
        if (obstacleLeft > 20 && obstacleLeft < 60 && dinoTop >= 120) {
            obstacle.classList.remove("obstacle-move");
            alert("Boom! Nabangga ka. Score mo: " + dinoScore);
            obstacle.classList.add("obstacle-move");
            dinoScore = 0;
            document.getElementById("dino-score").innerText = "Score: 0";
        }
    }

    // --- PUZZLE GAME LOGIC ---
    let secretNumber = Math.floor(Math.random() * 10) + 1;

    function checkGuess() {
        let guess = document.getElementById("guessInput").value;
        let msg = document.getElementById("puzzle-message");
        
        if (guess == secretNumber) {
            msg.innerText = "🎉 TAMA! Ang galing mo!";
            msg.style.color = "lime";
            secretNumber = Math.floor(Math.random() * 10) + 1; // Reset for next time
        } else if (guess > secretNumber) {
            msg.innerText = "Masyadong mataas, subukan ulit.";
            msg.style.color = "orange";
        } else {
            msg.innerText = "Masyadong mababa, subukan ulit.";
            msg.style.color = "orange";
        }
    }
</script>

</body>
</html>
